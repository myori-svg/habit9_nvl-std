name: ci

on:
  pull_request:
    branches:
      - feature/manual-gen
  push:
    branches:
      - feature/manual-gen

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
      - name: Install dependencies
        run: yarn install
      - name: Check
        run: yarn check-all